name: Python checks

on:
  push:
    branches:
      - "refactor/**"
  pull_request:
    branches:
      - "maintenance/player-role-autoassign"
      - "main"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile all Python files
        run: python -m compileall -q bot.py bot_core.py cogs
      - name: Import bot and feature modules
        run: python -c "import bot"
      - name: Smoke-test commands and persistent views
        run: |
          python - <<'PY'
          import bot
          from bot_core import MAIN_ROLE_CHOICES, POSITION_ROLE_IDS, RANK_ROLE_IDS, RANK_NICKNAME_LABELS
          from cogs.registration import RegistrationStartView
          from cogs.tournament import TournamentView
          from cogs.team import TeamApplicationPanelView
          from cogs.recruitment import RecruitmentView
          from cogs.custom import CustomRecruitmentPanelView, CustomRecruitmentView
          from cogs.roles import RolePanelView

          expected_commands = {
              "setup_registration",
              "fa_card",
              "tournament_create",
              "setup_team_panel",
              "setup_custom_panel",
              "setup_role_panel",
          }
          registered_commands = {command.name for command in bot.bot.tree.get_commands()}
          missing = expected_commands - registered_commands
          assert not missing, f"Missing commands: {sorted(missing)}"
          assert "コーチ" in MAIN_ROLE_CHOICES, "Coach option is missing"
          assert POSITION_ROLE_IDS.get("コーチ") == 1566029418843869276, "Coach role ID mismatch"
          assert RANK_ROLE_IDS.get("Platinum") == 1566032393855311922, "Platinum role ID mismatch"
          assert RANK_ROLE_IDS.get("Emerald") == 1566032229493248050, "Emerald role ID mismatch"
          assert RANK_NICKNAME_LABELS == {
              "Platinum": "P",
              "Emerald": "E",
              "Diamond": "D",
              "Master": "M",
              "Grandmaster": "GM",
              "Challenger": "CH",
          }, "Rank nickname labels mismatch"

          views = [
              RegistrationStartView(),
              TournamentView(),
              TeamApplicationPanelView(),
              RecruitmentView(),
              CustomRecruitmentPanelView(),
              CustomRecruitmentView(),
              RolePanelView(),
          ]
          assert all(view.timeout is None for view in views), "A persistent view has a timeout"
          assert all(len(view.children) > 0 for view in views), "A persistent view has no components"
          print(f"OK: {len(registered_commands)} commands, {len(views)} persistent views, coach option")
          PY
