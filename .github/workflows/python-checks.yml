name: Python checks

on:
  push:
    branches:
      - "refactor/**"
  pull_request:
    branches:
      - "maintenance/player-role-autoassign"
      - "main"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile all Python files
        run: python -m compileall -q bot.py bot_core.py cogs
      - name: Import bot and feature modules
        run: python -c "import bot"
